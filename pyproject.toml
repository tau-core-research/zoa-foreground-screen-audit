[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoa-foreground-screen-audit"
version = "0.1.0"
description = "Public reproducibility package for a Zone-of-Avoidance foreground-screen audit in SPARC/HECATE"
requires-python = ">=3.10"
dependencies = [
    "pytest",
    "reportlab",
]

[tool.setuptools.packages.find]
where = ["src"]
